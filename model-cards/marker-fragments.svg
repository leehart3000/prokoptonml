<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="How short can you go? Accuracy by sequence length"><title>How short can you go? Accuracy by sequence length</title><style>svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--s0:#2a78d6;--s1:#eb6834;}@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#353532;--s0:#3987e5;--s1:#d95926;}}text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ink2);font-size:12px}.title{fill:var(--ink);font-size:15px;font-weight:600}.grid{stroke:var(--grid);stroke-width:1}.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.dot{stroke:var(--surface);stroke-width:2}.ref{stroke:var(--ink2);stroke-width:1}.s0{stroke:var(--s0);}.f0{fill:var(--s0);}.s1{stroke:var(--s1);}.f1{fill:var(--s1);}</style><rect width="720" height="360" fill="var(--surface)"/><text x="64.0" y="28.0" text-anchor="start" class="title">How short can you go? Accuracy by sequence length</text><line class="grid" x1="64.0" y1="308.0" x2="544.0" y2="308.0"/><text x="56.0" y="312.0" text-anchor="end">0%</text><line class="grid" x1="64.0" y1="245.0" x2="544.0" y2="245.0"/><text x="56.0" y="249.0" text-anchor="end">25%</text><line class="grid" x1="64.0" y1="182.0" x2="544.0" y2="182.0"/><text x="56.0" y="186.0" text-anchor="end">50%</text><line class="grid" x1="64.0" y1="119.0" x2="544.0" y2="119.0"/><text x="56.0" y="123.0" text-anchor="end">75%</text><line class="grid" x1="64.0" y1="56.0" x2="544.0" y2="56.0"/><text x="56.0" y="60.0" text-anchor="end">100%</text><text x="16.0" y="182.0" text-anchor="middle" transform="rotate(-90 16 182.0)">Accuracy</text><line class="line s0" x1="64.0" y1="44.0" x2="80.0" y2="44.0"/><text x="86.0" y="48.0" text-anchor="start">Known species</text><line class="line s1" x1="185.0" y1="44.0" x2="201.0" y2="44.0"/><text x="207.0" y="48.0" text-anchor="start">Novel species (clean)</text><text