name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Manual runs scan the full history

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: Scan for secrets with TruffleHog
    runs-on: ubuntu-24.04 # Pinned; move to a newer image on purpose
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history, so new commits can be compared
          persist-credentials: false

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --results=verified,unknown
