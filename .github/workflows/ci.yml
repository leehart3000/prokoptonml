name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Give the workflow read-only access by default (least privilege)
permissions:
  contents: read

# Cancel an older run on the same branch when a newer commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, type-check and test
    runs-on: ubuntu-24.04 # Pinned; move to a newer image on purpose
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.1
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Run checks
        run: pixi run check
