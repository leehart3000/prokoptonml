[project]
name = "prokopton-ml"
version = "0.1.0"
description = "An end-to-end MLOps platform for building, deploying and monitoring scientific machine learning systems"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Lee Hart" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "prokopton>=0.1.0a1,<0.2",
    "numpy>=2",
    "pandas>=2.2",
    "pyarrow>=19",
    "mlflow>=3.1,<4",
    "scikit-learn>=1.6",
    "scipy>=1.13",
]

[project.optional-dependencies]
# The HTTP API (see Dockerfile); the image pins exact versions from the
# serving bundle's requirements.txt
serve = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
prokopton-ml = "prokopton.ml.cli:main"

[project.urls]
Homepage = "https://prokoptonml.org"
Repository = "https://github.com/leehart3000/prokoptonml"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prokopton"]

# --- Pixi: environments and tasks ---

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64"]
requires-pixi = ">=0.84"

[tool.pixi.dependencies]
python = "3.13.*"
pydantic = ">=2.11,<3"
numpy = ">=2"
pandas = ">=2.2"
pyarrow = ">=19"
mlflow = ">=3.1,<4"
scikit-learn = ">=1.6"
scipy = ">=1.13"
fastapi = ">=0.162.4,<0.163"
uvicorn = ">=0.54.0,<0.55"
httpx = ">=0.28.1,<0.29"

[tool.pixi.pypi-dependencies]
prokopton-ml = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
ruff = "*"
mypy = "*"
pytest = "*"
pytest-cov = "*"

[tool.pixi.feature.dev.tasks]
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
typecheck = "mypy"
test = "pytest"
check = { depends-on = ["format-check", "lint", "typecheck", "test"] }

[tool.pixi.tasks]
dnabarcode-ingest = "prokopton-ml ingest apps/dnabarcode/dnabarcode.toml"
dnabarcode-validate = "prokopton-ml validate apps/dnabarcode/dnabarcode.toml"
dnabarcode-split = "prokopton-ml split apps/dnabarcode/dnabarcode.toml"
dnabarcode-leakage = "prokopton-ml leakage apps/dnabarcode/dnabarcode.toml"
dnabarcode-sample = "prokopton-ml sample apps/dnabarcode/dnabarcode.toml"
dnabarcode-train = "prokopton-ml train apps/dnabarcode/dnabarcode.toml"
dnabarcode-calibrate = "prokopton-ml calibrate apps/dnabarcode/dnabarcode.toml"
dnabarcode-evaluate = "prokopton-ml evaluate apps/dnabarcode/dnabarcode.toml"
dnabarcode-card = "prokopton-ml card apps/dnabarcode/dnabarcode.toml"
dnabarcode-marker-sample = "prokopton-ml sample apps/dnabarcode/dnabarcode.toml --model marker"
dnabarcode-marker-train = "prokopton-ml train apps/dnabarcode/dnabarcode.toml --model marker"
dnabarcode-marker-calibrate = "prokopton-ml calibrate apps/dnabarcode/dnabarcode.toml --model marker"
dnabarcode-marker-evaluate = "prokopton-ml evaluate apps/dnabarcode/dnabarcode.toml --model marker"
dnabarcode-marker-card = "prokopton-ml card apps/dnabarcode/dnabarcode.toml --model marker"
dnabarcode-culicidae-reference = "prokopton-ml reference apps/dnabarcode/dnabarcode.toml --specialist culicidae"
dnabarcode-culicidae-evaluate = "prokopton-ml evaluate apps/dnabarcode/dnabarcode.toml --specialist culicidae"
dnabarcode-culicidae-card = "prokopton-ml card apps/dnabarcode/dnabarcode.toml --specialist culicidae"
dnabarcode-bundle = "prokopton-ml bundle apps/dnabarcode/dnabarcode.toml"
dnabarcode-serve = { cmd = "uvicorn --factory prokopton.ml.serving.app:create_app_from_env --port 8080", env = { PROKOPTON_BUNDLE = "data/models/dnabarcode/bundle" } }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
prod = { features = [], solve-group = "default" }

# --- Ruff: linting and formatting ---

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (likely bugs)
    "UP",  # pyupgrade (modern syntax)
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

# --- Mypy: static type checking ---

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = "src:tests"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These libraries do not ship (complete) type information
module = [
    "mlflow",
    "mlflow.*",
    "pandas",
    "pandas.*",
    "pyarrow",
    "pyarrow.*",
    "scipy",
    "scipy.*",
    "sklearn",
    "sklearn.*",
    "joblib",
    "joblib.*",
]
ignore_missing_imports = true

# --- Pytest: testing ---

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import shared helpers, e.g. "from fakes import FakeTracker"
pythonpath = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=prokopton.ml",
    "--cov-report=term-missing",
]

[tool.coverage.run]
omit = ["*/__main__.py"]
