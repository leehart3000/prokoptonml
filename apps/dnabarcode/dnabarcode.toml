# dnabarcode.org: DNA barcode identification, built on ProkoptonML.
# Validated against prokopton.ml.config.AppConfig. Any value can be overridden
# with an environment variable, e.g. PROKOPTON_DATA__PATHS__RAW_DIR=/some/folder

name = "dnabarcode"
title = "DNA barcoding"

[data.source]
# MIDORI2 reference databases, GenBank release 273 (CC BY 4.0).
# Cite: https://doi.org/10.5281/zenodo.22685701 and Leray et al. (2022),
# Environmental DNA 4: 894-907, https://doi.org/10.1002/edn3.303
type = "midori2"
release = "GB273"
doi = "10.5281/zenodo.22685701"
licence = "CC-BY-4.0"
archive_url = "https://zenodo.org/records/22685701/files/MIDORI2_GB273_SINTAX_sp.zip?download=1"
checksums_url = "https://zenodo.org/records/22685701/files/release_sha256.txt?download=1"
archive_name = "MIDORI2_GB273_SINTAX_sp.zip"
member_template = "SINTAX_sp/uniq/MIDORI2_UNIQ_NUC_SP_GB273_{gene}_SINTAX.fasta.gz"
# CO1 (COI) is the animal barcode; the other mitochondrial genes provide
# "not COI" examples for the gene classifier.
genes = [
  "CO1", "CO2", "CO3", "Cytb", "A6", "A8",
  "ND1", "ND2", "ND3", "ND4", "ND4L", "ND5", "ND6",
  "lrRNA", "srRNA",
]

[data.paths]
raw_dir = "data/raw/midori2_gb273"
interim_dir = "data/interim/dnabarcode"
processed_dir = "data/processed/dnabarcode"
splits_dir = "data/splits/dnabarcode"
leakage_dir = "data/leakage/dnabarcode"

[validation]
# Reviewed phylum -> kingdom table (see apps/dnabarcode/reference/README.md)
phylum_reference = "apps/dnabarcode/reference/phylum_lineages_gb273.tsv"
min_length = 100
max_length = 2000
# 1.0 = keep all: the training stage applies its own (tunable) threshold to the
# training data only, so test sets still contain realistic, imperfect sequences
max_ambiguous_fraction = 1.0
ambiguity_report_thresholds = [0.0, 0.01, 0.05, 0.10]
# Sequences shorter than this are counted separately in the conflict report
short_length = 200
top_shared_examples = 10

[split]
# Changing the salt reshuffles every split; record it with any published results
salt = "dnabarcode-gb273-v1"
# Whole named species held out, to measure performance on species not in training
novel_val_fraction = 0.05
novel_test_fraction = 0.05
# The remaining records, split by sequence (identical sequences stay together)
val_fraction = 0.10
test_fraction = 0.10
# Novel-species holdouts apply to COI only; other genes train the gene classifier
novel_species_genes = ["CO1"]
# Families reported separately, e.g. for planned specialists
report_families = ["Culicidae"]

[leakage]
# List novel-set records that have a near-identical (>=99%) training sequence,
# so evaluation can exclude them from novel-species scores. Settings were chosen
# with analysis/03_leakage_audit.py (see analysis/README.md): about 95% recall
# of a thorough search, in about a third of the time.
genes = ["CO1"]
query_splits = ["val_novel", "test_novel"]
reference_split = "train"
min_identity = 0.99
maxaccepts = 1
maxrejects = 8
threads = 8
chunk_size = 250000
